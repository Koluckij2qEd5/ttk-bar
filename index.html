<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ТТК напитков</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Цвета берутся из темы Телеграма; запасные значения нужны для открытия в обычном браузере */
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f5);
    --text: var(--tg-theme-text-color, #14171a);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-link-color, #2481cc);
    --line: color-mix(in srgb, var(--text) 12%, transparent);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([style*="--tg-theme-bg-color"]) {
      --bg: #17191c; --bg2: #22262b; --text: #f1f3f5; --hint: #98a1ab; --accent: #6ab3f3;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .screen { max-width: 560px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* Список */
  .search-wrap {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  #search {
    width: 100%;
    font: inherit; font-size: 17px;
    color: var(--text);
    background: var(--bg2);
    border: 0; border-radius: 12px;
    padding: 13px 14px;
    outline: none;
    -webkit-appearance: none; appearance: none;
  }
  #search:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  #search::placeholder { color: var(--hint); }
  #count { margin: 8px 2px 0; font-size: 13px; color: var(--hint); min-height: 1.2em; }

  .item {
    display: block; width: 100%;
    text-align: left; font: inherit; color: inherit;
    background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 15px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .item:active { background: var(--bg2); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item .name { font-weight: 500; }
  .item .via { display: block; margin-top: 3px; font-size: 14px; color: var(--hint); }

  .note { padding: 28px 20px; color: var(--hint); text-align: center; }
  .note strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .btn {
    margin-top: 16px; font: inherit;
    color: var(--accent); background: var(--bg2);
    border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  }

  /* Карточка */
  .card { padding: 4px 16px 32px; }
  .back {
    font: inherit; font-size: 16px; color: var(--accent);
    background: none; border: 0; padding: 14px 0 6px; cursor: pointer;
  }
  .card h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 4px; font-weight: 700; }
  .card .meta { color: var(--hint); font-size: 14px; margin-bottom: 14px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .row .ing { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .row .amt {
    flex: 0 0 auto; font-weight: 700; font-size: 19px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .row .amt small { font-weight: 500; font-size: 15px; color: var(--hint); margin-left: 3px; }
</style>
</head>
<body>

<main id="list-screen" class="screen">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Название или ингредиент" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Поиск напитка">
    <div id="count" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</main>

<section id="card-screen" class="screen" hidden>
  <div class="card">
    <button id="back" class="back" type="button">← Назад к списку</button>
    <h1 id="title"></h1>
    <div id="meta" class="meta"></div>
    <div id="ingredients"></div>
  </div>
</section>

<script>
/* ---------- Чтение drinks.txt ---------- */
// Название напитка — строка без «|». Ингредиент — строка «Название | количество». Пустые строки пропускаются.
function parseDrinks(text) {
  const drinks = [];
  let current = null;
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const bar = line.indexOf("|");
    if (bar === -1) {
      current = { name: line, items: [] };
      drinks.push(current);
    } else if (current) {
      current.items.push({
        name: line.slice(0, bar).trim(),
        amount: line.slice(bar + 1).trim()
      });
    }
  }
  // Если название встретилось дважды, оставляем последнее
  const byName = new Map();
  for (const d of drinks) byName.set(d.name, d);
  return [...byName.values()];
}

function norm(s) {
  return s.toLowerCase().replace(/ё/g, "е").trim();
}

// Разделяет «250 мл» на число и единицу, чтобы число выделять крупнее
function splitAmount(a) {
  const m = a.match(/^([\d.,]+)\s*(.*)$/);
  return m ? { num: m[1], unit: m[2] } : { num: a, unit: "" };
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ---------- Экран ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const listScreen = document.getElementById("list-screen");
const cardScreen = document.getElementById("card-screen");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");

let drinks = [];
let scrollY = 0;

function note(title, text, withRetry) {
  listEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "note";
  const strong = document.createElement("strong");
  strong.textContent = title;
  box.appendChild(strong);
  box.appendChild(document.createTextNode(text));
  if (withRetry) {
    const br = document.createElement("div");
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.type = "button";
    btn.textContent = "Попробовать снова";
    btn.onclick = load;
    br.appendChild(btn);
    box.appendChild(br);
  }
  listEl.appendChild(box);
}

function renderList() {
  const q = norm(searchEl.value);
  const shown = [];
  for (const d of drinks) {
    if (!q) { shown.push({ d, via: null }); continue; }
    if (norm(d.name).includes(q)) { shown.push({ d, via: null }); continue; }
    const hit = d.items.find(i => norm(i.name).includes(q));
    if (hit) shown.push({ d, via: hit.name });
  }
  // Сначала совпадения по названию, потом по составу
  shown.sort((a, b) => (a.via ? 1 : 0) - (b.via ? 1 : 0) || a.d.name.localeCompare(b.d.name, "ru"));

  countEl.textContent = q
    ? "Найдено: " + shown.length
    : drinks.length + " " + plural(drinks.length, "напиток", "напитка", "напитков");

  if (!shown.length) {
    note("Ничего не найдено", "Проверь написание или введи название ингредиента.", false);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const { d, via } of shown) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item";
    const n = document.createElement("span");
    n.className = "name";
    n.textContent = d.name;
    b.appendChild(n);
    if (via) {
      const v = document.createElement("span");
      v.className = "via";
      v.textContent = "В составе: " + via;
      b.appendChild(v);
    }
    b.onclick = () => openDrink(d);
    frag.appendChild(b);
  }
  listEl.innerHTML = "";
  listEl.appendChild(frag);
}

function showCard(d) {
  document.getElementById("title").textContent = d.name;
  document.getElementById("meta").textContent =
    d.items.length + " " + plural(d.items.length, "ингредиент", "ингредиента", "ингредиентов");
  const box = document.getElementById("ingredients");
  box.innerHTML = "";
  for (const i of d.items) {
    const row = document.createElement("div");
    row.className = "row";
    const ing = document.createElement("span");
    ing.className = "ing";
    ing.textContent = i.name;
    const amt = document.createElement("span");
    amt.className = "amt";
    const { num, unit } = splitAmount(i.amount);
    amt.appendChild(document.createTextNode(num));
    if (unit) {
      const u = document.createElement("small");
      u.textContent = unit;
      amt.appendChild(u);
    }
    row.appendChild(ing);
    row.appendChild(amt);
    box.appendChild(row);
  }
  listScreen.hidden = true;
  cardScreen.hidden = false;
  window.scrollTo(0, 0);
  if (tg) tg.BackButton.show();
}

function showList() {
  cardScreen.hidden = true;
  listScreen.hidden = false;
  window.scrollTo(0, scrollY);
  if (tg) tg.BackButton.hide();
}

function openDrink(d) {
  scrollY = window.scrollY;
  history.pushState({ card: d.name }, "");
  showCard(d);
}

function goBack() {
  if (history.state && history.state.card) history.back();
  else showList();
}

window.addEventListener("popstate", () => showList());
document.getElementById("back").onclick = goBack;
if (tg) tg.BackButton.onClick(goBack);
searchEl.addEventListener("input", renderList);

async function load() {
  note("Загружаю…", "", false);
  try {
    const r = await fetch("drinks.txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    drinks = parseDrinks(await r.text());
    if (!drinks.length) {
      note("Список пуст", "В файле drinks.txt нет ни одного напитка.", false);
      return;
    }
    renderList();
  } catch (e) {
    note("Не удалось загрузить список", "Проверь интернет и попробуй ещё раз.", true);
  }
}

load();
</script>
</body>
</html>
